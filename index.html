<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Project Hub</title>
  
  <!-- PWA iOS Metas -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Projects">
  <link rel="apple-touch-icon" href="https://fav.farm/🚀">

  <!-- Tailwind CSS & JSZip -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#6366f1', 600: '#4f46e5', 400: '#818cf8' }
          },
          keyframes: {
            fadeInScale: {
              '0%': { opacity: '0', transform: 'scale(0.95) translateY(10px)' },
              '100%': { opacity: '1', transform: 'scale(1) translateY(0)' }
            },
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-6px)' }
            }
          },
          animation: {
            'fade-in': 'fadeInScale 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'float': 'float 3s ease-in-out infinite'
          }
        }
      }
    }
  </script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .glass { background: rgba(24, 24, 27, 0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    .glass-card { background: rgba(30, 30, 36, 0.5); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    
    /* Свечение на фоне */
    .bg-glow-1 {
      position: absolute;
      top: -100px;
      left: 20%;
      width: 400px;
      height: 400px;
      background: rgba(99, 102, 241, 0.12);
      filter: blur(120px);
      border-radius: 50%;
      z-index: -1;
      pointer-events: none;
    }
    .bg-glow-2 {
      position: absolute;
      top: 300px;
      right: 10%;
      width: 350px;
      height: 350px;
      background: rgba(236, 72, 153, 0.08);
      filter: blur(140px);
      border-radius: 50%;
      z-index: -1;
      pointer-events: none;
    }
  </style>
</head>
<body class="bg-zinc-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased relative overflow-x-hidden">

  <!-- Декоративные фоновые пятна -->
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <!-- Header -->
  <header class="border-b border-zinc-800/80 sticky top-0 z-30 bg-zinc-950/75 backdrop-blur-xl">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-2xl animate-float">🚀</span>
        <h1 class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-200 to-brand-400 bg-clip-text text-transparent">Project Hub</h1>
      </div>
      <label for="fileInput" class="cursor-pointer px-4 py-2.5 bg-brand-600 hover:bg-brand-500 text-white rounded-xl text-sm font-semibold transition-all duration-200 shadow-lg shadow-brand-500/25 active:scale-95 flex items-center gap-2 border border-brand-400/20">
        <span>+ Добавить проект</span>
      </label>
      <input type="file" id="fileInput" accept=".zip,.html" class="hidden" multiple onchange="handleFileSelect(event)">
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-8 flex flex-col gap-8">

    <!-- Drag and Drop Zone -->
    <div id="dropZone" class="border-2 border-dashed border-zinc-800 hover:border-brand-500/60 rounded-3xl p-8 md:p-10 text-center transition-all duration-300 glass flex flex-col items-center justify-center gap-3 group cursor-pointer shadow-2xl relative overflow-hidden" onclick="document.getElementById('fileInput').click()">
      <div class="absolute inset-0 bg-brand-500/5 opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none"></div>
      <div class="w-16 h-16 rounded-2xl bg-zinc-900/90 border border-zinc-800 flex items-center justify-center text-3xl text-brand-400 group-hover:scale-110 group-hover:border-brand-500/40 transition-all duration-300 shadow-inner">📦</div>
      <div class="space-y-1">
        <p class="text-base font-semibold text-zinc-200 group-hover:text-white transition">Перетащите сюда ZIP с проектом или HTML-файл</p>
        <p class="text-xs text-zinc-400">Архив автоматически распакуется и создаст красивую карточку</p>
      </div>
    </div>

    <!-- Section Title for Projects -->
    <div class="flex items-center justify-between">
      <h2 class="text-sm font-bold tracking-wider text-zinc-400 uppercase">Ваши проекты</h2>
      <span id="projectCount" class="text-xs text-zinc-500 bg-zinc-900/80 px-2.5 py-1 rounded-full border border-zinc-800">0 проектов</span>
    </div>

    <!-- Projects Grid -->
    <div id="projectsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
      <!-- Cards rendered via JS -->
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-16 glass rounded-3xl border border-zinc-900">
      <div class="text-4xl mb-3">📂</div>
      <p class="text-zinc-400 text-sm font-medium">Проектов пока нет</p>
      <p class="text-zinc-600 text-xs mt-1">Загрузите свой первый мини-апп или веб-сайт через зону выше</p>
    </div>
  </main>

  <!-- Project Viewer Modal -->
  <div id="viewerModal" class="fixed inset-0 z-50 bg-zinc-950/95 backdrop-blur-xl hidden flex-col">
    <div class="flex items-center justify-between px-5 py-3.5 border-b border-zinc-800 bg-zinc-900/90">
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 rounded-full bg-brand-500 inline-block animate-pulse"></span>
        <h3 id="modalTitle" class="font-bold text-zinc-100 text-sm truncate">Название проекта</h3>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="toggleFullscreen()" class="px-3 py-1.5 bg-zinc-800 hover:bg-zinc-700 text-xs font-medium rounded-xl text-zinc-300 transition">На весь экран</button>
        <button onclick="closeViewer()" class="px-3 py-1.5 bg-red-500/10 hover:bg-red-500/20 text-red-400 text-xs font-medium rounded-xl border border-red-500/20 transition">Закрыть</button>
      </div>
    </div>
    <iframe id="projectIframe" class="w-full flex-1 border-none bg-white"></iframe>
  </div>

  <script>
    let projects = JSON.parse(localStorage.getItem('hub_projects') || '[]');

    document.addEventListener('DOMContentLoaded', renderProjects);

    // Drag & Drop handlers
    const dropZone = document.getElementById('dropZone');
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, e => { e.preventDefault(); e.stopPropagation(); }, false);
    });
    dropZone.addEventListener('drop', e => {
      const files = e.dataTransfer.files;
      if (files.length) processFiles(files);
    });

    function handleFileSelect(e) {
      if (e.target.files.length) processFiles(e.target.files);
    }

    async function processFiles(files) {
      for (let file of files) {
        if (file.name.endsWith('.html')) {
          const text = await file.text();
          saveProject(file.name.replace('.html', ''), text);
        } else if (file.name.endsWith('.zip')) {
          await processZip(file);
        }
      }
    }

    async function processZip(file) {
      try {
        const zip = await JSZip.loadAsync(file);
        let indexFile = zip.file('index.html');
        
        if (!indexFile) {
          const files = Object.keys(zip.files);
          const found = files.find(f => f.endsWith('index.html'));
          if (found) indexFile = zip.file(found);
        }

        if (!indexFile) {
          alert('В архиве не найден файл index.html!');
          return;
        }

        const htmlContent = await indexFile.async('string');
        const projName = file.name.replace('.zip', '');
        saveProject(projName, htmlContent);
      } catch (err) {
        alert('Ошибка при чтении ZIP архива: ' + err.message);
      }
    }

    function saveProject(name, htmlContent) {
      const newProj = {
        id: Date.now().toString(),
        title: name,
        date: new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' }),
        content: htmlContent
      };
      projects.unshift(newProj);
      try {
        localStorage.setItem('hub_projects', JSON.stringify(projects));
        renderProjects();
      } catch(e) {
        alert('Превышен лимит памяти браузера.');
      }
    }

    function renderProjects() {
      const grid = document.getElementById('projectsGrid');
      const empty = document.getElementById('emptyState');
      const countBadge = document.getElementById('projectCount');
      grid.innerHTML = '';

      countBadge.textContent = `${projects.length} проект${projects.length === 1 ? '' : projects.length < 5 ? 'а' : 'ов'}`;

      if (projects.length === 0) {
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      projects.forEach((p, index) => {
        const card = document.createElement('div');
        card.className = 'glass-card border border-zinc-800/80 hover:border-brand-500/40 rounded-3xl p-6 flex flex-col justify-between gap-5 transition-all duration-300 group shadow-lg hover:shadow-brand-500/5 animate-fade-in relative overflow-hidden';
        card.style.animationDelay = `${index * 0.05}s`;
        
        card.innerHTML = `
          <div class="absolute top-0 right-0 w-32 h-32 bg-brand-500/5 rounded-full blur-2xl group-hover:bg-brand-500/10 transition-all pointer-events-none"></div>
          <div>
            <div class="flex items-start justify-between gap-3">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-zinc-900 border border-zinc-800 flex items-center justify-center text-lg text-brand-400 group-hover:scale-110 transition-transform shadow-inner">⚡</div>
                <h3 class="font-bold text-zinc-100 group-hover:text-brand-400 transition text-base tracking-tight">${p.title}</h3>
              </div>
              <button onclick="deleteProject('${p.id}')" class="w-8 h-8 rounded-xl bg-zinc-900/50 hover:bg-red-500/10 text-zinc-500 hover:text-red-400 flex items-center justify-center transition border border-zinc-800/80" title="Удалить">✕</button>
            </div>
            <div class="flex items-center gap-2 mt-4 text-xs text-zinc-400">
              <span>Добавлен: ${p.date}</span>
            </div>
          </div>
          <button onclick="openProject('${p.id}')" class="w-full py-3 bg-zinc-900 hover:bg-brand-600 text-zinc-200 hover:text-white rounded-2xl text-xs font-semibold transition-all duration-200 border border-zinc-800 hover:border-brand-500 shadow-md flex items-center justify-center gap-2 group/btn">
            <span>Запустить проект</span>
            <span class="group-hover/btn:translate-x-1 transition-transform">→</span>
          </button>
        `;
        grid.appendChild(card);
      });
    }

    function openProject(id) {
      const proj = projects.find(p => p.id === id);
      if (!proj) return;

      const modal = document.getElementById('viewerModal');
      const iframe = document.getElementById('projectIframe');
      document.getElementById('modalTitle').textContent = proj.title;

      const blob = new Blob([proj.content], { type: 'text/html' });
      iframe.src = URL.createObjectURL(blob);

      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeViewer() {
      const modal = document.getElementById('viewerModal');
      const iframe = document.getElementById('projectIframe');
      iframe.src = '';
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function deleteProject(id) {
      if (confirm('Вы уверены, что хотите удалить этот проект?')) {
        projects = projects.filter(p => p.id !== id);
        localStorage.setItem('hub_projects', JSON.stringify(projects));
        renderProjects();
      }
    }

    function toggleFullscreen() {
      const iframe = document.getElementById('projectIframe');
      if (iframe.requestFullscreen) iframe.requestFullscreen();
    }
  </script>
</body>
</html>
